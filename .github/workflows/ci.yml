name: Document Intelligence CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
  API_REPOSITORY: ${{ vars.ECR_API_REPOSITORY }}
  UI_REPOSITORY: ${{ vars.ECR_UI_REPOSITORY }}

jobs:
  # ========================================================
  # TEST
  # ========================================================
  test:
    name: Test and scan source
    runs-on: ubuntu-24.04

    steps:
      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Check out source
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Tesseract OCR
      # --------------------------------------------------------
      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr

      # --------------------------------------------------------
      # Python
      # --------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      # --------------------------------------------------------
      # Dependencies
      # --------------------------------------------------------
      - name: Install dependencies and scanners
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pip-audit bandit

      # --------------------------------------------------------
      # Tests
      # --------------------------------------------------------
      - name: Run tests
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/document_intelligence
          NVIDIA_API_KEY: test-nvidia-key
          GROQ_API_KEY: test-groq-key
          GEMINI_API_KEY: test-gemini-key
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_KEY: test-supabase-key
          JWT_SECRET_KEY: test-only-jwt-secret
        run: |
          python -m pytest -q

      # --------------------------------------------------------
      # Offline evaluation
      # --------------------------------------------------------
      - name: Run offline evaluation gate
        run: |
          python evals/run_offline.py evals/responses.example.json

      # --------------------------------------------------------
      # Dependency audit
      # --------------------------------------------------------
      - name: Audit Python dependencies
        continue-on-error: true
        run: |
          pip-audit

      # --------------------------------------------------------
      # Bandit
      # --------------------------------------------------------
      - name: Run static security scan
        run: |
          bandit -r app -ll

  # ========================================================
  # BUILD
  # ========================================================
  build:
    name: Build, scan, and push images

    if: github.event_name != 'pull_request'

    needs: [test]

    runs-on: ubuntu-24.04

    permissions:
      contents: read
      id-token: write

    steps:
      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Check out source
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # AWS credentials
      # KEEPING YOUR WORKING ACCESS KEY AUTHENTICATION
      # --------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # --------------------------------------------------------
      # ECR login
      # --------------------------------------------------------
      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------------
      # Image names
      # --------------------------------------------------------
      - name: Set image names
        id: image
        run: |
          set -euo pipefail

          API_IMAGE="$ECR_REGISTRY/$API_REPOSITORY:${GITHUB_SHA}"
          UI_IMAGE="$ECR_REGISTRY/$UI_REPOSITORY:${GITHUB_SHA}"

          echo "api=$API_IMAGE" >> "$GITHUB_OUTPUT"
          echo "ui=$UI_IMAGE" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # Docker Buildx
      # --------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------
      # Build API
      # --------------------------------------------------------
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          load: true
          tags: ${{ steps.image.outputs.api }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # --------------------------------------------------------
      # Build UI
      # --------------------------------------------------------
      - name: Build UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ui
          load: true
          tags: ${{ steps.image.outputs.ui }}
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui

      # --------------------------------------------------------
      # Scan API
      # --------------------------------------------------------
      - name: Scan API image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.api }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: 0

      # --------------------------------------------------------
      # Scan UI
      # --------------------------------------------------------
      - name: Scan UI image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.ui }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: 0

      # ========================================================
      # PUSH IMAGES TO AMAZON ECR
      # ========================================================

      # --------------------------------------------------------
      # Push API
      # --------------------------------------------------------
      - name: Push API image
        run: |
          set -euo pipefail

          docker tag \
            "${{ steps.image.outputs.api }}" \
            "${{ env.ECR_REGISTRY }}/${{ env.API_REPOSITORY }}:latest"

          docker push "${{ steps.image.outputs.api }}"

          docker push \
            "${{ env.ECR_REGISTRY }}/${{ env.API_REPOSITORY }}:latest"

      # --------------------------------------------------------
      # Push UI
      # --------------------------------------------------------
      - name: Push UI image
        run: |
          set -euo pipefail

          docker tag \
            "${{ steps.image.outputs.ui }}" \
            "${{ env.ECR_REGISTRY }}/${{ env.UI_REPOSITORY }}:latest"

          docker push "${{ steps.image.outputs.ui }}"

          docker push \
            "${{ env.ECR_REGISTRY }}/${{ env.UI_REPOSITORY }}:latest"

  # ========================================================
  # DEPLOY
  # ========================================================
  deploy:
    name: Deploy to ECS Fargate

    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    needs: [build]

    runs-on: ubuntu-24.04

    permissions:
      contents: read
      id-token: write

    steps:
      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Check out source
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Deployment tools
      # --------------------------------------------------------
      - name: Install deployment tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext-base jq

      # --------------------------------------------------------
      # AWS credentials
      # KEEPING YOUR WORKING ACCESS KEY AUTHENTICATION
      # --------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # --------------------------------------------------------
      # ECR login
      # --------------------------------------------------------
      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ========================================================
      # VALIDATE DEPLOYMENT CONFIGURATION
      # ========================================================
      - name: Validate deployment configuration
        env:
          API_IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.API_REPOSITORY }}:${{ github.sha }}
          UI_IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.UI_REPOSITORY }}:${{ github.sha }}

          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}

          ECS_API_TASK_FAMILY: ${{ vars.ECS_API_TASK_FAMILY }}
          ECS_UI_TASK_FAMILY: ${{ vars.ECS_UI_TASK_FAMILY }}

          ECS_API_CONTAINER_NAME: ${{ vars.ECS_API_CONTAINER_NAME }}
          ECS_UI_CONTAINER_NAME: ${{ vars.ECS_UI_CONTAINER_NAME }}

          ECS_API_SERVICE: ${{ vars.ECS_API_SERVICE }}
          ECS_UI_SERVICE: ${{ vars.ECS_UI_SERVICE }}

          ECS_API_BASE_URL: ${{ secrets.ECS_API_BASE_URL }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}

        run: |
          set -euo pipefail

          echo "Validating deployment configuration..."

          test -n "$AWS_REGION"
          test -n "$ECS_CLUSTER"

          test -n "$ECS_API_TASK_FAMILY"
          test -n "$ECS_UI_TASK_FAMILY"

          test -n "$ECS_API_CONTAINER_NAME"
          test -n "$ECS_UI_CONTAINER_NAME"

          test -n "$ECS_API_SERVICE"
          test -n "$ECS_UI_SERVICE"

          test -n "$API_IMAGE"
          test -n "$UI_IMAGE"

          test -n "$ECS_API_BASE_URL"
          test -n "$CORS_ORIGINS"

          echo "Deployment configuration validated successfully."

      # ========================================================
      # DOWNLOAD ACTIVE TASK DEFINITIONS
      # ========================================================

      # --------------------------------------------------------
      # API task definition
      # --------------------------------------------------------
      - name: Download active API task definition
        run: |
          set -euo pipefail

          aws ecs describe-task-definition \
            --task-definition "${{ vars.ECS_API_TASK_FAMILY }}" \
            --query taskDefinition \
            --output json \
            > task-def-api.json

      # --------------------------------------------------------
      # UI task definition
      # --------------------------------------------------------
      - name: Download active UI task definition
        run: |
          set -euo pipefail

          aws ecs describe-task-definition \
            --task-definition "${{ vars.ECS_UI_TASK_FAMILY }}" \
            --query taskDefinition \
            --output json \
            > task-def-ui.json

      # ========================================================
      # CONFIGURE API TASK DEFINITION
      # ========================================================

      - name: Configure API task definition environment
        env:
          API_IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.API_REPOSITORY }}:${{ github.sha }}

          ECS_API_CONTAINER_NAME: ${{ vars.ECS_API_CONTAINER_NAME }}

          # ----------------------------------------------------
          # Public API configuration
          # ----------------------------------------------------
          ENVIRONMENT: ${{ vars.ENVIRONMENT || 'production' }}

          ECS_API_BASE_URL: ${{ vars.ECS_API_BASE_URL }}

          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}

          # ----------------------------------------------------
          # Supabase
          # ----------------------------------------------------
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_BUCKET_NAME: ${{ secrets.SUPABASE_BUCKET_NAME }}

          # ----------------------------------------------------
          # NVIDIA
          # ----------------------------------------------------
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_PRIMARY_MODEL: ${{ secrets.NVIDIA_PRIMARY_MODEL }}

          # ----------------------------------------------------
          # Groq
          # ----------------------------------------------------
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}

          # ----------------------------------------------------
          # Gemini
          # ----------------------------------------------------
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GEMINI_TTS_MODEL: ${{ secrets.GEMINI_TTS_MODEL }}

          # ----------------------------------------------------
          # Database
          # ----------------------------------------------------
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

          # ----------------------------------------------------
          # JWT
          # ----------------------------------------------------
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          JWT_ALGORITHM: ${{ secrets.JWT_ALGORITHM }}
          ACCESS_TOKEN_EXPIRE_MINUTES: ${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}

          # ----------------------------------------------------
          # LangSmith
          # ----------------------------------------------------
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_TRACING_V2: ${{ secrets.LANGSMITH_TRACING_V2 }}
          LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}

          LANGCHAIN_ENDPOINT: ${{ secrets.LANGCHAIN_ENDPOINT }}

          # ----------------------------------------------------
          # Redis
          # ----------------------------------------------------
          REDIS_URL: ${{ secrets.REDIS_URL }}

          # ----------------------------------------------------
          # Portkey
          # ----------------------------------------------------
          PORTKEYS_API_KEY: ${{ secrets.PORTKEYS_API_KEY }}
          PORTKEYS_VIRTUAL_KEY: ${{ secrets.PORTKEYS_VIRTUAL_KEY }}
          PORTKEYS_ENABLED: ${{ secrets.PORTKEYS_ENABLED }}

          # ----------------------------------------------------
          # SMTP
          # ----------------------------------------------------
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}

          # ----------------------------------------------------
          # Password reset
          # ----------------------------------------------------
          PASSWORD_RESET_EXPIRE_MINUTES: ${{ secrets.PASSWORD_RESET_EXPIRE_MINUTES }}

        run: |
          set -euo pipefail

          echo "Configuring API task definition..."

          jq \
            --arg image "$API_IMAGE" \
            --arg container "$ECS_API_CONTAINER_NAME" \
            --arg environment "$ENVIRONMENT" \
            --arg api_base_url "$ECS_API_BASE_URL" \
            --arg cors_origins "$CORS_ORIGINS" \
            --arg sb_url "$SUPABASE_URL" \
            --arg sb_key "$SUPABASE_SERVICE_KEY" \
            --arg sb_bucket "$SUPABASE_BUCKET_NAME" \
            --arg nv_key "$NVIDIA_API_KEY" \
            --arg db_url "$DATABASE_URL" \
            --arg nv_model "$NVIDIA_PRIMARY_MODEL" \
            --arg groq_key "$GROQ_API_KEY" \
            --arg groq_model "$GROQ_MODEL" \
            --arg gem_key "$GEMINI_API_KEY" \
            --arg gem_model "$GEMINI_MODEL" \
            --arg gem_tts "$GEMINI_TTS_MODEL" \
            --arg jwt_sec "$JWT_SECRET_KEY" \
            --arg jwt_alg "$JWT_ALGORITHM" \
            --arg tok_exp "$ACCESS_TOKEN_EXPIRE_MINUTES" \
            --arg ls_key "$LANGSMITH_API_KEY" \
            --arg ls_trace "$LANGSMITH_TRACING_V2" \
            --arg ls_proj "$LANGSMITH_PROJECT" \
            --arg lc_end "$LANGCHAIN_ENDPOINT" \
            --arg redis "$REDIS_URL" \
            --arg pk_key "$PORTKEYS_API_KEY" \
            --arg pk_virt "$PORTKEYS_VIRTUAL_KEY" \
            --arg pk_en "$PORTKEYS_ENABLED" \
            --arg smtp_h "$SMTP_HOST" \
            --arg smtp_p "$SMTP_PORT" \
            --arg smtp_u "$SMTP_USERNAME" \
            --arg smtp_pass "$SMTP_PASSWORD" \
            --arg smtp_from "$SMTP_FROM_EMAIL" \
            --arg pwd_exp "$PASSWORD_RESET_EXPIRE_MINUTES" \
            '
            .containerDefinitions |= map(
              if .name == $container then

                .image = $image

                |

                .environment = [

                  {
                    "name": "ENVIRONMENT",
                    "value": $environment
                  },

                  {
                    "name": "ECS_API_BASE_URL",
                    "value": $api_base_url
                  },

                  {
                    "name": "CORS_ORIGINS",
                    "value": $cors_origins
                  },

                  {
                    "name": "SUPABASE_URL",
                    "value": $sb_url
                  },

                  {
                    "name": "SUPABASE_SERVICE_KEY",
                    "value": $sb_key
                  },

                  {
                    "name": "SUPABASE_BUCKET_NAME",
                    "value": $sb_bucket
                  },

                  {
                    "name": "NVIDIA_API_KEY",
                    "value": $nv_key
                  },

                  {
                    "name": "DATABASE_URL",
                    "value": $db_url
                  },

                  {
                    "name": "NVIDIA_PRIMARY_MODEL",
                    "value": $nv_model
                  },

                  {
                    "name": "GROQ_API_KEY",
                    "value": $groq_key
                  },

                  {
                    "name": "GROQ_MODEL",
                    "value": $groq_model
                  },

                  {
                    "name": "GEMINI_API_KEY",
                    "value": $gem_key
                  },

                  {
                    "name": "GEMINI_MODEL",
                    "value": $gem_model
                  },

                  {
                    "name": "GEMINI_TTS_MODEL",
                    "value": $gem_tts
                  },

                  {
                    "name": "JWT_SECRET_KEY",
                    "value": $jwt_sec
                  },

                  {
                    "name": "JWT_ALGORITHM",
                    "value": $jwt_alg
                  },

                  {
                    "name": "ACCESS_TOKEN_EXPIRE_MINUTES",
                    "value": $tok_exp
                  },

                  {
                    "name": "LANGSMITH_API_KEY",
                    "value": $ls_key
                  },

                  {
                    "name": "LANGSMITH_TRACING_V2",
                    "value": $ls_trace
                  },

                  {
                    "name": "LANGSMITH_PROJECT",
                    "value": $ls_proj
                  },

                  {
                    "name": "LANGCHAIN_ENDPOINT",
                    "value": $lc_end
                  },

                  {
                    "name": "REDIS_URL",
                    "value": $redis
                  },

                  {
                    "name": "PORTKEYS_API_KEY",
                    "value": $pk_key
                  },

                  {
                    "name": "PORTKEYS_VIRTUAL_KEY",
                    "value": $pk_virt
                  },

                  {
                    "name": "PORTKEYS_ENABLED",
                    "value": $pk_en
                  },

                  {
                    "name": "SMTP_HOST",
                    "value": $smtp_h
                  },

                  {
                    "name": "SMTP_PORT",
                    "value": $smtp_p
                  },

                  {
                    "name": "SMTP_USERNAME",
                    "value": $smtp_u
                  },

                  {
                    "name": "SMTP_PASSWORD",
                    "value": $smtp_pass
                  },

                  {
                    "name": "SMTP_FROM_EMAIL",
                    "value": $smtp_from
                  },

                  {
                    "name": "PASSWORD_RESET_EXPIRE_MINUTES",
                    "value": $pwd_exp
                  }

                ]

              else
                .
              end
            )
            ' task-def-api.json > task-def-api.tmp.json

          mv task-def-api.tmp.json task-def-api.json

          jq empty task-def-api.json

          echo "API task definition configured successfully."

      # ========================================================
      # CONFIGURE UI TASK DEFINITION
      # ========================================================

      - name: Configure UI task definition environment
        env:
          UI_IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.UI_REPOSITORY }}:${{ github.sha }}

          ECS_UI_CONTAINER_NAME: ${{ vars.ECS_UI_CONTAINER_NAME }}

          # ----------------------------------------------------
          # Streamlit must call the API ALB
          # API ALB listener = HTTP :8000
          # ----------------------------------------------------
          ECS_UI_API_URL: ${{ secrets.ECS_UI_API_URL || secrets.ECS_API_BASE_URL }}

          # ----------------------------------------------------
          # Existing UI configuration
          # ----------------------------------------------------
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_BUCKET_NAME: ${{ secrets.SUPABASE_BUCKET_NAME }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}

        run: |
          set -euo pipefail

          echo "Configuring UI task definition..."

          jq \
            --arg image "$UI_IMAGE" \
            --arg container "$ECS_UI_CONTAINER_NAME" \
            --arg sb_url "$SUPABASE_URL" \
            --arg sb_key "$SUPABASE_SERVICE_KEY" \
            --arg sb_bucket "$SUPABASE_BUCKET_NAME" \
            --arg jwt_sec "$JWT_SECRET_KEY" \
            --arg api_url "$ECS_UI_API_URL" \
            '
            .containerDefinitions |= map(
              if .name == $container then

                .image = $image

                |

                .environment = [

                  {
                    "name": "SUPABASE_URL",
                    "value": $sb_url
                  },

                  {
                    "name": "SUPABASE_SERVICE_KEY",
                    "value": $sb_key
                  },

                  {
                    "name": "SUPABASE_BUCKET_NAME",
                    "value": $sb_bucket
                  },

                  {
                    "name": "JWT_SECRET_KEY",
                    "value": $jwt_sec
                  },

                  {
                    "name": "API_URL",
                    "value": $api_url
                  },

                  {
                    "name": "ECS_UI_API_URL",
                    "value": $api_url
                  }

                ]

              else
                .
              end
            )
            ' task-def-ui.json > task-def-ui.tmp.json

          mv task-def-ui.tmp.json task-def-ui.json

          jq empty task-def-ui.json

          echo "UI task definition configured successfully."

      # ========================================================
      # RENDER API IMAGE
      # ========================================================

      - name: Render API task definition
        id: render-api
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def-api.json
          container-name: ${{ vars.ECS_API_CONTAINER_NAME }}
          image: ${{ env.ECR_REGISTRY }}/${{ env.API_REPOSITORY }}:${{ github.sha }}

      # ========================================================
      # RENDER UI IMAGE
      # ========================================================

      - name: Render UI task definition
        id: render-ui
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def-ui.json
          container-name: ${{ vars.ECS_UI_CONTAINER_NAME }}
          image: ${{ env.ECR_REGISTRY }}/${{ env.UI_REPOSITORY }}:${{ github.sha }}

      # ========================================================
      # DEPLOY API
      # ========================================================

      - name: Deploy Amazon ECS API Service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-api.outputs.task-definition }}
          service: ${{ vars.ECS_API_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true

      # ========================================================
      # DEPLOY UI
      # ========================================================

      - name: Deploy Amazon ECS UI Service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-ui.outputs.task-definition }}
          service: ${{ vars.ECS_UI_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true
