name: Document Intelligence CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Prevent multiple production deployments from running simultaneously.
concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
  API_REPOSITORY: ${{ vars.ECR_API_REPOSITORY }}
  UI_REPOSITORY: ${{ vars.ECR_UI_REPOSITORY }}

# ============================================================
# TEST, EVALUATION, DEPENDENCY AUDIT AND SECURITY SCANNING
# ============================================================

jobs:
  test:
    name: Test and scan source
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies and scanners
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pip-audit bandit

      - name: Run tests
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/document_intelligence
          NVIDIA_API_KEY: test-nvidia-key
          GROQ_API_KEY: test-groq-key
          GEMINI_API_KEY: test-gemini-key
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_KEY: test-supabase-key
          JWT_SECRET_KEY: test-only-jwt-secret
        run: |
          python -m pytest -q

      - name: Run offline evaluation gate
        run: |
          python evals/run_offline.py evals/responses.example.json

      - name: Audit Python dependencies
        continue-on-error: true
        run: |
          pip-audit

      - name: Run static security scan
        run: |
          bandit -r app -ll

  # ============================================================
  # BUILD DOCKER IMAGES, SECURITY SCAN, PUSH TO AMAZON ECR
  # ============================================================

  build:
    name: Build, scan, and push images
    if: github.event_name != 'pull_request'
    needs: [test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image names
        id: image
        run: |
          set -euo pipefail
          API_IMAGE="$ECR_REGISTRY/$API_REPOSITORY:${GITHUB_SHA}"
          UI_IMAGE="$ECR_REGISTRY/$UI_REPOSITORY:${GITHUB_SHA}"
          echo "api=$API_IMAGE" >> "$GITHUB_OUTPUT"
          echo "ui=$UI_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          load: true
          tags: ${{ steps.image.outputs.api }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ui
          load: true
          tags: ${{ steps.image.outputs.ui }}
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui

      - name: Scan API image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.api }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Scan UI image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.ui }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Push API image
        run: |
          set -euo pipefail
          docker tag "${{ steps.image.outputs.api }}" "${{ env.ECR_REGISTRY }}/${{ env.API_REPOSITORY }}:latest"
          docker push "${{ steps.image.outputs.api }}"
          docker push "${{ env.ECR_REGISTRY }}/${{ env.API_REPOSITORY }}:latest"

      - name: Push UI image
        run: |
          set -euo pipefail
          docker tag "${{ steps.image.outputs.ui }}" "${{ env.ECR_REGISTRY }}/${{ env.UI_REPOSITORY }}:latest"
          docker push "${{ steps.image.outputs.ui }}"
          docker push "${{ env.ECR_REGISTRY }}/${{ env.UI_REPOSITORY }}:latest"

  # ============================================================
  # DEPLOY TO AMAZON ECS FARGATE
  # ============================================================

  deploy:
    name: Deploy to ECS Fargate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install deployment tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext-base jq

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Validate deployment configuration
        env:
          API_IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.API_REPOSITORY }}:${{ github.sha }}
          UI_IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.UI_REPOSITORY }}:${{ github.sha }}
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_API_TASK_FAMILY: ${{ vars.ECS_API_TASK_FAMILY }}
          ECS_UI_TASK_FAMILY: ${{ vars.ECS_UI_TASK_FAMILY }}
          ECS_API_CONTAINER_NAME: ${{ vars.ECS_API_CONTAINER_NAME }}
          ECS_UI_CONTAINER_NAME: ${{ vars.ECS_UI_CONTAINER_NAME }}
          ECS_API_SERVICE: ${{ vars.ECS_API_SERVICE }}
          ECS_UI_SERVICE: ${{ vars.ECS_UI_SERVICE }}
          ECS_API_BASE_URL: ${{ secrets.ECS_API_BASE_URL || 'http://107.21.90.181:8000' }}
          ECS_UI_API_URL: ${{ secrets.ECS_UI_API_URL || 'http://107.21.90.181:8501' }}
        run: |
          set -euo pipefail
          echo "Deployment configuration validated successfully."

      - name: Download active API task definition
        run: |
          set -euo pipefail
          aws ecs describe-task-definition --task-definition "${{ vars.ECS_API_TASK_FAMILY }}" --query taskDefinition --output json > task-def-api.json

      - name: Download active UI task definition
        run: |
          set -euo pipefail
          aws ecs describe-task-definition --task-definition "${{ vars.ECS_UI_TASK_FAMILY }}" --query taskDefinition --output json > task-def-ui.json

      - name: Configure API task definition environment
        env:
          API_IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.API_REPOSITORY }}:${{ github.sha }}
          ECS_API_CONTAINER_NAME: ${{ vars.ECS_API_CONTAINER_NAME }}
          ENVIRONMENT: ${{ vars.ENVIRONMENT || 'production' }}
          ECS_API_BASE_URL: ${{ secrets.ECS_API_BASE_URL || 'http://107.21.90.181:8000' }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS || 'http://107.21.90.181' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          jq \
            --arg image "$API_IMAGE" \
            --arg container "$ECS_API_CONTAINER_NAME" \
            --arg environment "$ENVIRONMENT" \
            --arg api_url "$ECS_API_BASE_URL" \
            --arg cors "$CORS_ORIGINS" \
            --arg sb_url "$SUPABASE_URL" \
            --arg sb_key "$SUPABASE_SERVICE_KEY" \
            '
            .containerDefinitions |= map(
              if .name == $container then
                .image = $image
                |
                .environment = [
                  { "name": "ENVIRONMENT", "value": $environment },
                  { "name": "ECS_API_BASE_URL", "value": $api_url },
                  { "name": "CORS_ORIGINS", "value": $cors },
                  { "name": "SUPABASE_URL", "value": $sb_url },
                  { "name": "SUPABASE_SERVICE_KEY", "value": $sb_key }
                ]
              else . end
            )
            ' task-def-api.json > tmp.json && mv tmp.json task-def-api.json

      - name: Configure UI task definition environment
        env:
          UI_IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.UI_REPOSITORY }}:${{ github.sha }}
          ECS_UI_CONTAINER_NAME: ${{ vars.ECS_UI_CONTAINER_NAME }}
          UI_API_URL: ${{ vars.ECS_UI_API_URL || 'http://107.21.90.181:8000' }}
          ENVIRONMENT: ${{ vars.ENVIRONMENT || 'production' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_SECRET_ARN }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY_SECRET_ARN }}
        run: |
          set -euo pipefail
          jq \
            --arg image "$UI_IMAGE" \
            --arg container "$ECS_UI_CONTAINER_NAME"             --arg api_url "$UI_API_URL" \
            --arg environment "$ENVIRONMENT" \
            --arg sb_url "$SUPABASE_URL" \
            --arg sb_key "$SUPABASE_SERVICE_KEY" \
            '
            .containerDefinitions |= map(
              if .name == $container then
                .image = $image
                |
                .environment = [
                  { "name": "ECS_UI_API_URL", "value": $api_url },
                  { "name": "ENVIRONMENT", "value": $environment },
                  { "name": "SUPABASE_URL", "value": $sb_url },
                  { "name": "SUPABASE_SERVICE_KEY", "value": $sb_key }
                ]
              else . end
            )
            ' task-def-ui.json > tmp.json && mv tmp.json task-def-ui.json

      - name: Render API task definition
        id: render-api
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def-api.json
          container-name: ${{ vars.ECS_API_CONTAINER_NAME }}
          image: ${{ env.ECR_REGISTRY }}/${{ env.API_REPOSITORY }}:${{ github.sha }}

      - name: Render UI task definition
        id: render-ui
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def-ui.json
          container-name: ${{ vars.ECS_UI_CONTAINER_NAME }}
          image: ${{ env.ECR_REGISTRY }}/${{ env.UI_REPOSITORY }}:${{ github.sha }}

      - name: Deploy Amazon ECS API Service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-api.outputs.task-definition }}
          service: ${{ vars.ECS_API_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Deploy Amazon ECS UI Service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-ui.outputs.task-definition }}
          service: ${{ vars.ECS_UI_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true
